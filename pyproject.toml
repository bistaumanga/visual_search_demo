[project]
name = "visual-search"
version = "0.1.0"
description = "Imane to image and Text to image search demo."
readme = "README.md"
requires-python = ">=3.13,<3.14"
tool.uv.package = true

dependencies = [
    "bm25s>=0.2.14",
    "datasets>=4.4.2",
    "gradio>=6.2.0",
    "numpy>=2.4.1",
    "pillow>=11.0.0",
    "pydantic>=2.12.5",
    "pytest>=9.0.2",
    "safetensors>=0.7.0",
    "sentence-transformers>=5.2.0",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "transformers>=4.57.3",
    "simsimd>=6.5.12",
    "usearch>=2.21.0",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.1",
]

[project.optional-dependencies]
extras = [
    "langchain>=1.2.3",
    "langgraph>=1.0.5",
    "matplotlib>=3.10.8",
    "notebook>=7.5.1",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.0",
    "faiss-cpu>=1.13.2",
    "docling>=2.67.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

